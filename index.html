<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Papa 💙</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#ffd6e8,#fff5fa);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
    color:#333;
}

h1{
    font-size:38px;
    color:#1e6cff;
    margin-bottom:25px;
}

p{
    font-size:20px;
    margin-bottom:30px;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:30px;
    background:#1e6cff;
    color:white;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 5px 15px #999;
}

.heart{
    position:absolute;
    font-size:35px;
    color:#1e6cff;
    animation:float 4s infinite ease-in-out;
}

@keyframes float{
    0%{
        transform:translateY(40px);
    }
    50%{
        transform:translateY(-40px);
    }
    100%{
        transform:translateY(40px);
    }
}

</style>
</head>

<body>

<div class="heart">💙</div>

<div class="container">

<h1>For My Papa 💙👩‍❤️‍👨</h1>

<p>A little surprise is waiting for you 🥹✨</p>

<button onclick="startSurprise()">
🎵 Tap to Play
</button>

</div>


<script>

function startSurprise(){
    alert("Surprise starting soon 💙✨");
}

</script>

</body>
</html>
<body>

<audio id="song" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>


<div class="heart">💙</div>


<div class="container" id="home">

<h1>For My Papa 💙👩‍❤️‍👨</h1>

<p>A little surprise is waiting for you 🥹✨</p>

<button onclick="startSurprise()">
🎵 Tap to Play
</button>

</div>



<div class="container" id="birthday" style="display:none;">

<h1>Happy Birthday My Baby 🎂💙</h1>

<p>
You are my favourite person forever 🧿🥹
</p>

<button onclick="nextPage()">
Open Surprise 🎁
</button>

</div>



<script>

function startSurprise(){

let music = document.getElementById("song");
music.play();

document.getElementById("home").style.display="none";
document.getElementById("birthday").style.display="block";

}


function nextPage(){

alert("Next surprise coming 💙✨");

}

</script>
<div class="container" id="cakePage" style="display:none;">

<h1>MY BABY TURNS INTO 22 YEARS OLD 🧿🥹</h1>

<div class="cake">
    🎂
</div>

<div class="candles">
    🕯️ 🕯️ 🕯️
</div>

<p>
Make a wish my baby 💙✨
</p>

<button onclick="blowCandle()">
Blow Candles 🥳
</button>

</div>
