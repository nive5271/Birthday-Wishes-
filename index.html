<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Papa 💙</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#ffdbe9,#fff8fb);
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.page{
display:none;
width:100%;
height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.active{
display:flex;
}

h1{
color:#1f6dff;
font-size:35px;
margin-bottom:20px;
}

p{
font-size:18px;
color:#555;
max-width:330px;
line-height:1.7;
}

button{
margin-top:30px;
padding:15px 35px;
border:none;
border-radius:40px;
background:#1f6dff;
color:white;
font-size:18px;
cursor:pointer;
}

.heart{
position:absolute;
bottom:-30px;
left:12%;
font-size:38px;
animation:floatHeart 8s linear infinite;
}

@keyframes floatHeart{

0%{
transform:translateY(0);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-120vh);
opacity:0;
}

}

audio{
display:none;
}

</style>
</head>

<body>

<audio id="song" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="heart">💙</div>

<div class="page active" id="home">

<h1>For My Papa 💙👩‍❤️‍👨</h1>

<p>
A little surprise is waiting for you...🥹✨
</p>

<button onclick="startSurprise()">
🎵 Tap To Play
</button>

</div>
<div class="page" id="birthday">

<h1>Happy Birthday My Baby 🎂💙</h1>

<p>
MY BABY TURNS INTO 22 YEARS OLD 🧿🥹
</p>

<div style="font-size:100px;margin:20px 0;">
🎂
</div>

<button onclick="showGift()">
Blow Candles 🕯️
</button>

</div>


<div class="page" id="gift">

<h1>A Surprise For You 🎁</h1>

<div id="giftBox"
onclick="openGift()"
style="font-size:110px;cursor:pointer;">
🎁
</div>

<p>
Tap the Gift Box 💙
</p>

</div>


<div class="page" id="final">

<h1>Happy Birthday My Love 💙</h1>

<p>

May your smile stay forever... 🥹💙<br><br>

I Love You So Much ❤️

</p>

</div>


<script>

function startSurprise(){

document.getElementById("song").play();

document.getElementById("home").classList.remove("active");
document.getElementById("birthday").classList.add("active");

}

function showGift(){

document.getElementById("birthday").classList.remove("active");
document.getElementById("gift").classList.add("active");

}

function openGift(){

document.getElementById("giftBox").innerHTML="💝";

setTimeout(function(){

document.getElementById("gift").classList.remove("active");
document.getElementById("final").classList.add("active");

},1500);

}

</script>

</body>
</html>
