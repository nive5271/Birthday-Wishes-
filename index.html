<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Papa 💙</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:'Poppins',sans-serif;

background:
linear-gradient(135deg,#ffd9ec 0%,#ffeef7 50%,#fff8fc 100%);

min-height:100vh;

overflow-x:hidden;

color:#555;

}

.page{

display:none;

min-height:100vh;

width:100%;

padding:30px;

justify-content:center;

align-items:center;

flex-direction:column;

text-align:center;

position:relative;

}

.page.active{

display:flex;

animation:fade .8s ease;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}

h1{

font-family:'Pacifico',cursive;

font-size:42px;

color:#ff4f93;

font-weight:normal;

margin-bottom:20px;

line-height:1.4;

text-shadow:
0 4px 10px rgba(255,79,147,.18);

}

p{

font-size:18px;

line-height:1.8;

max-width:380px;

color:#666;

}

button{

margin-top:35px;

padding:16px 40px;

border:none;

border-radius:50px;

background:linear-gradient(135deg,#ff6fa8,#ff8fc1);

color:#fff;

font-size:18px;

font-weight:600;

cursor:pointer;

box-shadow:
0 12px 25px rgba(255,111,168,.35);

transition:.35s;

}

button:hover{

transform:scale(1.05);

}

button:active{

transform:scale(.96);

}
  .heart{

position:fixed;

left:8%;

bottom:-60px;

font-size:42px;

animation:floatHeart 11s linear infinite;

z-index:5;

}

@keyframes floatHeart{

0%{

transform:translateY(0) rotate(0deg);

opacity:0;

}

20%{

opacity:1;

}

80%{

opacity:1;

}

100%{

transform:translateY(-120vh) rotate(25deg);

opacity:0;

}

}

.card{

background:#ffffffcc;

backdrop-filter:blur(12px);

border-radius:30px;

padding:35px 25px;

width:100%;

max-width:430px;

box-shadow:

0 15px 40px rgba(255,170,205,.35);

}

audio{

display:none;

}

</style>

</head>

<body>

<audio id="music" loop>

<source src="music.mp3" type="audio/mpeg">

</audio>

<div class="heart">💙</div>

<div class="page active" id="home">

<div class="card">

<h1>For My Papa 💙</h1>

<p>

A little birthday surprise is waiting for you... 🥹✨

</p>

<button onclick="startSurprise()">

🎵 Tap To Play

</button>

</div>

</div>
<div class="page" id="cake">

<div class="card">

<h1>Happy Birthday My Baby 🎂</h1>

<p>

MY BABY TURNS INTO<br>

<b>22 YEARS OLD</b> 🧿🥹

</p>

<div class="cake">

🎂

</div>

<p style="margin-top:15px">

Make a wish...✨

</p>

<button onclick="showGift()">

🕯️ Blow Candles

</button>

</div>

</div>

<style>

.cake{

font-size:110px;

margin-top:20px;

animation:bounce 2s infinite;

}

@keyframes bounce{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-12px);

}

}

</style>
<div class="page" id="gift">

<div class="card">

<h1>Your Surprise 🎁</h1>

<div id="giftBox" style="font-size:110px;cursor:pointer;margin:20px 0;" onclick="openGift()">
🎁
</div>

<p>Tap the gift box... 💙</p>

</div>

</div>

<div class="page" id="final">

<div class="card">

<h1>I Am Your Birthday Gift 🎁💙</h1>

<p>

No matter where life takes us...<br><br>

I'll always be with you. 🥹❤️

</p>

</div>

</div>

<script>

function startSurprise(){

const music=document.getElementById("music");

music.play().catch(()=>{});

document.getElementById("home").classList.remove("active");
document.getElementById("cake").classList.add("active");

}

function showGift(){

document.getElementById("cake").classList.remove("active");
document.getElementById("gift").classList.add("active");

}
  
function openGift(){

const box=document.getElementById("giftBox");

box.style.transition="0.6s";

box.style.transform="scale(2.2) rotate(15deg)";

box.style.opacity="0";

setTimeout(function(){

box.innerHTML="<div style='font-size:30px;font-weight:600;color:#ff4f93;'>I Am Your Birthday Gift 🎁💙</div>";

box.style.transform="scale(0)";

box.style.opacity="1";

setTimeout(function(){

box.style.transform="scale(1)";

},100);

},600);

setTimeout(function(){

document.getElementById("gift").classList.remove("active");

document.getElementById("final").classList.add("active");

},2800);

  }
