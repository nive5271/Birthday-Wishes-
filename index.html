<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Papa 💙</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#ffd9ec,#fff5fa);
overflow-x:hidden;
min-height:100vh;
color:#444;
}

.page{
width:100%;
min-height:100vh;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
padding:25px;
text-align:center;
}

.page.active{
display:flex;
}

h1{
font-size:34px;
color:#1b67ff;
margin-bottom:18px;
}

p{
font-size:18px;
line-height:1.8;
max-width:600px;
}

button{
margin-top:30px;
padding:15px 35px;
border:none;
border-radius:40px;
background:#1b67ff;
color:#fff;
font-size:18px;
cursor:pointer;
transition:.3s;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

button:hover{
transform:scale(1.05);
}

.heart{
position:fixed;
left:8%;
bottom:-20px;
font-size:40px;
animation:heartFloat 10s linear infinite;
}

@keyframes heartFloat{

0%{
transform:translateY(0);
opacity:0;
}

20%{
opacity:1;
}

80%{
opacity:1;
}

100%{
transform:translateY(-120vh);
opacity:0;
}

}

audio{
display:none;
}

</style>

</head>

<body>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="heart">💙</div>

<div class="page active" id="home">

<h1>For My Papa 💙👩‍❤️‍👨</h1>

<p>
A little surprise is waiting for you...
Tap the button below. 🥹✨
</p>

<button onclick="startSurprise()">
🎵 Tap To Play
</button>

</div>
